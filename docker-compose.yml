# Optional: local/dev helpers. Production API is the Rust binary (apps/api-rs)
# via systemd — see deploy/README.md. This compose only builds the static web
# image for one-off artifact export if needed.

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: arateki-web
    restart: "no"
    volumes:
      - ./dist-front:/output
