name: Deploy Arateki

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      target:
        description: Deploy target
        required: true
        default: both
        type: choice
        options:
          - archlinux
          - ec2-t3-nano
          - both

jobs:
  # ==========================================
  # BUILD: Rust API (musl) + web prerender
  # ==========================================
  build:
    runs-on: ubuntu-latest
    environment: production
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup Rust (stable + musl)
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-unknown-linux-musl

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: apps/api-rs -> target
        shared-key: arateki-api-rs

    - name: Install musl toolchain
      run: sudo apt-get update && sudo apt-get install -y musl-tools

    - name: Test Rust API
      working-directory: apps/api-rs
      run: cargo test

    - name: Build static API binary (musl)
      working-directory: apps/api-rs
      env:
        CC_x86_64_unknown_linux_musl: musl-gcc
        CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      run: cargo build --release --target x86_64-unknown-linux-musl

    - name: Stage binary artifact
      run: |
        mkdir -p api-dist
        cp apps/api-rs/target/x86_64-unknown-linux-musl/release/arateki-api api-dist/arateki-api
        chmod +x api-dist/arateki-api
        cp -r deploy api-dist/deploy
        file api-dist/arateki-api
        ls -lh api-dist/arateki-api

    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 24.x
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Resolve browser for prerender
      id: prerender-browser
      shell: bash
      run: |
        for candidate in google-chrome-stable google-chrome chromium chromium-browser; do
          if command -v "$candidate" >/dev/null 2>&1; then
            browser_path="$(command -v "$candidate")"
            echo "Using system browser at $browser_path"
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
            echo "use-bundled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        done

        echo "No system Chrome/Chromium found; falling back to Playwright download."
        echo "use-bundled=true" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright headless browser
      if: ${{ steps.prerender-browser.outputs.use-bundled == 'true' }}
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-headless-shell-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          playwright-headless-shell-${{ runner.os }}-

    - name: Ensure Playwright headless browser for prerender
      if: ${{ steps.prerender-browser.outputs.use-bundled == 'true' }}
      timeout-minutes: 8
      run: pnpm --filter @arateki/web exec playwright install --with-deps --only-shell chromium

    - name: Start Rust API for prerender
      timeout-minutes: 5
      run: |
        export JWT_SECRET="${{ secrets.JWT_SECRET }}"
        export JWT_EXPIRES_IN=12h
        export ADMIN_LOGIN="${{ secrets.ADMIN_LOGIN }}"
        export ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD }}"
        export SQLITE_PATH=/tmp/prerender.db
        export PUBLIC_SITE_URL=https://arateki.com
        export HOST=127.0.0.1
        export PORT=3333
        ./api-dist/arateki-api > /tmp/api.log 2>&1 &
        echo $! > /tmp/api.pid

    - name: Wait for API
      run: |
        for i in {1..30}; do
          if curl -fsS http://127.0.0.1:3333/api/health >/dev/null; then
            exit 0
          fi
          sleep 2
        done
        echo "API did not become healthy in time"
        cat /tmp/api.log || true
        exit 1

    - name: Build frontend with prerender
      run: PRERENDER_API_BASE=http://127.0.0.1:3333 pnpm --filter @arateki/web build

    - name: Validate frontend prerender output
      run: |
        test -f apps/web/dist/index.html
        test -f apps/web/dist/pt/index.html
        test -f apps/web/dist/pt/sales/index.html
        test -f apps/web/dist/en/index.html
        test -f apps/web/dist/en/sales/index.html
        test -f apps/web/dist/ja/sales/index.html
        test -f apps/web/dist/og-image.png
        test -f apps/web/dist/robots.txt
        test -f apps/web/dist/sitemap.xml
        test "$(grep -o '<title>' apps/web/dist/index.html | wc -l)" -eq 1
        test "$(grep -o 'name="description"' apps/web/dist/index.html | wc -l)" -eq 1
        test "$(grep -o '<title>' apps/web/dist/ja/sales/index.html | wc -l)" -eq 1
        test "$(grep -o 'name="description"' apps/web/dist/ja/sales/index.html | wc -l)" -eq 1
        node --input-type=module <<'NODE'
        import { access } from 'node:fs/promises';

        const langs = ['pt', 'en', 'es', 'zh', 'ja'];
        const response = await fetch('http://127.0.0.1:3333/api/products?lang=pt&country=BR');
        if (!response.ok) {
          throw new Error(`Products API returned ${response.status}`);
        }

        const { products } = await response.json();
        if (!Array.isArray(products) || products.length === 0) {
          throw new Error('Products API returned no products; product prerender cannot be validated');
        }

        for (const product of products) {
          if (!product.id) throw new Error('Product without id returned by API');

          for (const lang of langs) {
            await access(`apps/web/dist/${lang}/sales/${encodeURIComponent(product.id)}/index.html`);
          }
        }
        NODE

    - name: Show prerender API logs on failure
      if: ${{ failure() }}
      run: |
        echo "--- API log ---"
        cat /tmp/api.log || true

    - name: Stop prerender API
      if: ${{ always() }}
      run: |
        if [ -f /tmp/api.pid ]; then
          kill "$(cat /tmp/api.pid)" 2>/dev/null || true
        fi

    - name: Upload Frontend Artifact
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dist
        path: apps/web/dist/
        retention-days: 1

    - name: Upload API binary
      uses: actions/upload-artifact@v4
      with:
        name: api-binary
        path: api-dist/
        retention-days: 1


  # ==========================================
  # DEPLOY home-server — Rust binary + front (local rsync)
  # ==========================================
  deploy-archlinux:
    needs: build
    if: ${{ github.event_name == 'push' || github.event.inputs.target == 'archlinux' || github.event.inputs.target == 'both' }}
    runs-on: [self-hosted, archlinux]
    environment: production
    env:
      # Home runner has no passwordless sudo — keep everything under home-server paths.
      FRONT_PATH: /opt/home-server/websites/arateki/dist-front
      API_ROOT: /opt/home-server/arateki
      API_BIN: /opt/home-server/arateki/bin/arateki-api
      API_ENV: /opt/home-server/arateki/api.env
      API_DATA: /opt/home-server/arateki/data
      API_LOG: /opt/home-server/arateki/api.log

    steps:
    - name: Download Frontend Artifact
      uses: actions/download-artifact@v4
      with:
        name: frontend-dist
        path: dist-front-downloaded

    - name: Download API binary
      uses: actions/download-artifact@v4
      with:
        name: api-binary
        path: api-dist

    - name: Deploy Frontend
      run: |
        mkdir -p "$FRONT_PATH"
        rsync -a --delete dist-front-downloaded/ "$FRONT_PATH"/

    - name: Deploy Rust API (user-space binary)
      timeout-minutes: 5
      run: |
        set -euo pipefail
        chmod +x api-dist/arateki-api
        mkdir -p "$API_ROOT/bin" "$API_DATA"
        install -m 755 api-dist/arateki-api "$API_BIN"

        if [ ! -f "$API_ENV" ]; then
          umask 077
          {
            echo "PORT=3333"
            echo "HOST=127.0.0.1"
            echo "SQLITE_PATH=$API_DATA/arateki.db"
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}"
            echo "JWT_EXPIRES_IN=12h"
            echo "ADMIN_LOGIN=${{ secrets.ADMIN_LOGIN }}"
            echo "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}"
            echo "PUBLIC_SITE_URL=https://arateki.com"
          } > "$API_ENV"
          chmod 600 "$API_ENV"
        fi

        # stop legacy Node Docker container if present
        if command -v docker >/dev/null 2>&1; then
          docker stop arateki-api 2>/dev/null || true
          docker rm arateki-api 2>/dev/null || true
        fi

        # restart process (static musl binary — no root/systemd required)
        if [ -f "$API_ROOT/arateki-api.pid" ]; then
          kill "$(cat "$API_ROOT/arateki-api.pid")" 2>/dev/null || true
          rm -f "$API_ROOT/arateki-api.pid"
        fi
        pkill -f "$API_BIN" 2>/dev/null || true
        sleep 1

        set -a
        # shellcheck disable=SC1090
        source "$API_ENV"
        set +a
        nohup "$API_BIN" >> "$API_LOG" 2>&1 &
        echo $! > "$API_ROOT/arateki-api.pid"
        sleep 1
        curl -fsS http://127.0.0.1:3333/api/health


  # ==========================================
  # DEPLOY EC2 t3.nano — Rust binary via SSH
  # ==========================================
  deploy-ec2-t3-nano:
    needs: build
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'ec2-t3-nano' || github.event.inputs.target == 'both')) }}
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Download Frontend Artifact
      uses: actions/download-artifact@v4
      with:
        name: frontend-dist
        path: dist-front

    - name: Download API binary
      uses: actions/download-artifact@v4
      with:
        name: api-binary
        path: api-dist

    - name: Configure SSH
      run: |
        install -m 700 -d ~/.ssh
        echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

    - name: Deploy frontend
      run: rsync -az --delete -e "ssh -i ~/.ssh/id_ed25519" dist-front/ deploy@${{ secrets.EC2_HOST }}:/var/www/arateki/dist-front/

    - name: Deploy Rust API binary
      run: |
        chmod +x api-dist/arateki-api
        rsync -az -e "ssh -i ~/.ssh/id_ed25519" \
          api-dist/arateki-api \
          deploy@${{ secrets.EC2_HOST }}:/tmp/arateki-api
        rsync -az -e "ssh -i ~/.ssh/id_ed25519" \
          api-dist/deploy/ \
          deploy@${{ secrets.EC2_HOST }}:/tmp/arateki-deploy/
        ssh -i ~/.ssh/id_ed25519 deploy@${{ secrets.EC2_HOST }} '
          set -e
          sudo install -d -m 755 /opt/arateki/bin
          sudo install -m 755 /tmp/arateki-api /opt/arateki/bin/arateki-api
          if [ -f /tmp/arateki-deploy/arateki-api.service ]; then
            sudo cp /tmp/arateki-deploy/arateki-api.service /etc/systemd/system/arateki-api.service
            sudo systemctl daemon-reload
          fi
          sudo systemctl restart arateki-api
          sudo systemctl is-active arateki-api
        '
