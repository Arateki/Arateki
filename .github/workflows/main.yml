name: Deploy Arateki

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      target:
        description: Deploy target
        required: true
        default: archlinux
        type: choice
        options:
          - archlinux
          - ec2-t3-nano
          - both

jobs:
  # ==========================================
  # JOB 1: COMPILAÇÃO NO SERVIDOR DO GITHUB
  # ==========================================
  build:
    runs-on: ubuntu-latest
    environment: production
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 24.x
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Resolve browser for prerender
      id: prerender-browser
      shell: bash
      run: |
        for candidate in google-chrome-stable google-chrome chromium chromium-browser; do
          if command -v "$candidate" >/dev/null 2>&1; then
            browser_path="$(command -v "$candidate")"
            echo "Using system browser at $browser_path"
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
            echo "use-bundled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        done

        echo "No system Chrome/Chromium found; falling back to Playwright download."
        echo "use-bundled=true" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright headless browser
      if: ${{ steps.prerender-browser.outputs.use-bundled == 'true' }}
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-headless-shell-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          playwright-headless-shell-${{ runner.os }}-

    - name: Ensure Playwright headless browser for prerender
      if: ${{ steps.prerender-browser.outputs.use-bundled == 'true' }}
      timeout-minutes: 8
      run: pnpm --filter @arateki/web exec playwright install --with-deps --only-shell chromium

    - name: Build API
      run: pnpm --filter @arateki/api build

    - name: Start API (SQLite) for Prerender
      # node:sqlite é embutido no Node >= 23.4 (runner usa Node 24.x); sem MongoDB, sem Docker.
      timeout-minutes: 5
      run: |
        echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" > apps/api/.env.prerender
        echo "JWT_EXPIRES_IN=12h" >> apps/api/.env.prerender
        echo "ADMIN_LOGIN=${{ secrets.ADMIN_LOGIN }}" >> apps/api/.env.prerender
        echo "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}" >> apps/api/.env.prerender
        echo "SQLITE_PATH=/tmp/prerender.db" >> apps/api/.env.prerender
        echo "PUBLIC_SITE_URL=https://arateki.com" >> apps/api/.env.prerender
        node --env-file=apps/api/.env.prerender apps/api/dist/main.js > /tmp/api.log 2>&1 &
        echo $! > /tmp/api.pid

    - name: Wait for API
      run: |
        for i in {1..30}; do
          if curl -fsS http://127.0.0.1:3333/api/health >/dev/null; then
            exit 0
          fi
          sleep 2
        done
        echo "API did not become healthy in time"
        exit 1

    - name: Build frontend with prerender
      run: PRERENDER_API_BASE=http://127.0.0.1:3333 pnpm --filter @arateki/web build

    - name: Validate frontend prerender output
      run: |
        test -f apps/web/dist/index.html
        test -f apps/web/dist/pt/index.html
        test -f apps/web/dist/pt/sales/index.html
        test -f apps/web/dist/en/index.html
        test -f apps/web/dist/en/sales/index.html
        test -f apps/web/dist/ja/sales/index.html
        test -f apps/web/dist/og-image.png
        test -f apps/web/dist/robots.txt
        test -f apps/web/dist/sitemap.xml
        test "$(grep -o '<title>' apps/web/dist/index.html | wc -l)" -eq 1
        test "$(grep -o 'name="description"' apps/web/dist/index.html | wc -l)" -eq 1
        test "$(grep -o '<title>' apps/web/dist/ja/sales/index.html | wc -l)" -eq 1
        test "$(grep -o 'name="description"' apps/web/dist/ja/sales/index.html | wc -l)" -eq 1
        node --input-type=module <<'NODE'
        import { access } from 'node:fs/promises';

        const langs = ['pt', 'en', 'es', 'zh', 'ja'];
        const response = await fetch('http://127.0.0.1:3333/api/products?lang=pt&country=BR');
        if (!response.ok) {
          throw new Error(`Products API returned ${response.status}`);
        }

        const { products } = await response.json();
        if (!Array.isArray(products) || products.length === 0) {
          throw new Error('Products API returned no products; product prerender cannot be validated');
        }

        for (const product of products) {
          if (!product.id) throw new Error('Product without id returned by API');

          for (const lang of langs) {
            await access(`apps/web/dist/${lang}/sales/${encodeURIComponent(product.id)}/index.html`);
          }
        }
        NODE

    - name: Show prerender API logs on failure
      if: ${{ failure() }}
      run: |
        echo "--- API log ---"
        cat /tmp/api.log || true

    - name: Stop prerender API
      if: ${{ always() }}
      run: |
        if [ -f /tmp/api.pid ]; then
          kill "$(cat /tmp/api.pid)" 2>/dev/null || true
        fi

    - name: Upload Frontend Artifact
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dist
        path: apps/web/dist/
        retention-days: 1

    - name: Package API runtime
      run: |
        mkdir -p api-bundle/apps/api
        cp -r apps/api/dist api-bundle/apps/api/dist
        cp apps/api/package.json api-bundle/apps/api/package.json
        cp pnpm-lock.yaml pnpm-workspace.yaml package.json api-bundle/
        cp -r deploy api-bundle/deploy
        tar czf api-bundle.tar.gz -C api-bundle .

    - name: Upload API bundle
      uses: actions/upload-artifact@v4
      with:
        name: api-bundle
        path: api-bundle.tar.gz
        retention-days: 1


  # ==========================================
  # JOB 2: DEPLOY NO SERVIDOR PRINCIPAL (Docker, SQLite)
  # ==========================================
  deploy-archlinux:
    needs: build
    if: ${{ github.event_name == 'push' || github.event.inputs.target == 'archlinux' || github.event.inputs.target == 'both' }}
    runs-on: [self-hosted, archlinux]
    environment: production
    env:
      FRONT_PATH: /opt/home-server/websites/arateki/dist-front

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Download Frontend Artifact
      uses: actions/download-artifact@v4
      with:
        name: frontend-dist
        path: dist-front-downloaded

    - name: Build API Docker image (SQLite)
      timeout-minutes: 15
      run: docker build -f apps/api/Dockerfile -t arateki-api:latest .

    - name: Deploy Frontend
      run: |
        mkdir -p "$FRONT_PATH"
        rsync -a --delete dist-front-downloaded/ "$FRONT_PATH"/

    - name: Deploy API
      # Serviço único com volume SQLite persistente (sem MongoDB).
      timeout-minutes: 12
      run: |
        echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" > .env
        echo "JWT_EXPIRES_IN=12h" >> .env
        echo "ADMIN_LOGIN=${{ secrets.ADMIN_LOGIN }}" >> .env
        echo "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}" >> .env
        echo "CORS_ORIGIN=https://arateki.com" >> .env
        echo "PUBLIC_SITE_URL=https://arateki.com" >> .env
        docker compose -f docker-compose.prod.yml up -d api

    - name: Show Docker status on failure
      if: ${{ failure() }}
      run: |
        docker compose -f docker-compose.prod.yml ps
        docker compose -f docker-compose.prod.yml logs --tail=200 api

    - name: Cleanup Docker images
      run: |
        docker image prune -f


  # ==========================================
  # JOB 3: DEPLOY MANUAL NA EC2 T3 NANO (bare-metal, SSH-push)
  # ==========================================
  deploy-ec2-t3-nano:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'ec2-t3-nano' || github.event.inputs.target == 'both') }}
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Download Frontend Artifact
      uses: actions/download-artifact@v4
      with:
        name: frontend-dist
        path: dist-front

    - name: Download API bundle
      uses: actions/download-artifact@v4
      with:
        name: api-bundle
        path: api-bundle

    - name: Configure SSH
      run: |
        install -m 700 -d ~/.ssh
        echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

    - name: Deploy frontend
      run: rsync -az --delete -e "ssh -i ~/.ssh/id_ed25519" dist-front/ deploy@${{ secrets.EC2_HOST }}:/var/www/arateki/dist-front/

    - name: Deploy API bundle
      run: |
        rsync -az -e "ssh -i ~/.ssh/id_ed25519" api-bundle/api-bundle.tar.gz deploy@${{ secrets.EC2_HOST }}:/tmp/api-bundle.tar.gz
        ssh -i ~/.ssh/id_ed25519 deploy@${{ secrets.EC2_HOST }} '
          set -e
          sudo rm -rf /opt/arateki/api && sudo mkdir -p /opt/arateki/api
          sudo tar xzf /tmp/api-bundle.tar.gz -C /opt/arateki
          cd /opt/arateki && sudo corepack pnpm install --prod --filter @arateki/api --frozen-lockfile
          sudo systemctl restart arateki-api
        '
