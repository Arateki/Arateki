name: Deploy Arateki

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: self-hosted
    environment: production
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 24.x
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Clean previous build files
      run: |
        mkdir -p apps/web/dist
        rm -rf apps/web/dist/*

    - name: Build project
      run: pnpm build

    - name: Deploy API and Database
      run: |
        echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" > .env
        echo "JWT_EXPIRES_IN=12h" >> .env
        echo "ADMIN_LOGIN=${{ secrets.ADMIN_LOGIN }}" >> .env
        echo "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}" >> .env
        echo "CORS_ORIGIN=https://arateki.com" >> .env
        docker compose up -d --build mongodb api
        docker image prune -f
