<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Arateki — Open-source hardware. Privacy first.">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#1C1C1C"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#E0E0E0" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#111111" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="600" cy="270" r="420" fill="url(#halo)"/>

  <g transform="translate(70, 70)">
    <rect x="0" y="0" width="36" height="6" fill="#E8E8E8" opacity="0.85"/>
    <text x="56" y="14" font-family="Helvetica, Arial, sans-serif" font-size="14" letter-spacing="6" fill="#E8E8E8" opacity="0.7">OPEN SOURCE HARDWARE</text>
  </g>

  <text x="70" y="320" font-family="Helvetica, Arial, sans-serif" font-size="148" font-weight="800" fill="#E8E8E8" letter-spacing="-4">ARATEKI</text>

  <text x="70" y="400" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="500" fill="#E8E8E8" opacity="0.85">Soluções confiáveis. Você define como usar.</text>

  <g transform="translate(70, 450)">
    <text font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#E8E8E8" opacity="0.6" letter-spacing="0.5">
      <tspan x="0" y="0">Privacy-first IoT • Hidroponia inteligente • Direito ao reparo</tspan>
    </text>
  </g>

  <g transform="translate(70, 530)">
    <text font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#E8E8E8" letter-spacing="3" opacity="0.7">
      <tspan x="0" y="0">SAFRASENSE</tspan>
      <tspan x="180" y="0">•</tspan>
      <tspan x="200" y="0">RAIZNET.COM</tspan>
      <tspan x="400" y="0">•</tspan>
      <tspan x="420" y="0">ARATEKI.COM</tspan>
    </text>
  </g>

  <g transform="translate(950, 80) scale(0.5)" fill="#E8E8E8" opacity="0.9">
    <path d="M 60,340 L 200,60 L 200,71.3 L 65.8,340 Z"/>
    <path d="M 340,340 L 200,60 L 200,71.3 L 334.2,340 Z"/>
  </g>
